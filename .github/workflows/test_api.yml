name: API tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types:
            - created
permissions: {}

jobs:
    App:
        permissions:
          contents: read
        name: Test api
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Build the stack
              run: |
                  cd backend
                  mv .env.template .env
                  docker-compose up -d --build
            - name: Build test server
              run: |
                  docker exec collaborative-training-auth_server_1 pytest -v
